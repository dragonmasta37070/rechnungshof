service:
    url: "https://localhost"
    name: "Rechnungshof"

database:
    host: "0.0.0.0"
    user: "abrechnung"
    dbname: "abrechnung"

api:
    host: "0.0.0.0"
    base_url: "https://localhost"
    port: 8080
    id: default

# Authentik is the sole identity provider. These three are overridden per
# deployment via ABRECHNUNG_OIDC__ISSUER / __AUDIENCE / __JWKS_URL.
oidc:
    issuer: "https://authentik.example.org/application/o/rechnungshof/"
    audience: "rechnungshof"
    jwks_url: "https://authentik.example.org/application/o/rechnungshof/jwks/"
