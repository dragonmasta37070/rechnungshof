# Production stack for Komodo + Traefik.
#
# Deliberately NOT based on docker-compose.prod.yaml: that one pulls
# quay.io/abrechnung/*:latest-release, which is upstream's image and still has
# the local email/password login this fork removed. These images are our own,
# built and pushed to GHCR by .github/workflows/deploy.yml on every push to
# master, which then triggers Komodo to pull and redeploy.
#
# IMAGE_TAG defaults to latest; set it to a commit sha to pin or roll back.
#
# Traefik points at the frontend, not the api. nginx inside the frontend
# container serves the Angular app and proxies /api to the backend, so the
# browser sees one origin — which is what keeps the access token same-origin
# and lets the app's interceptor refuse to attach it anywhere else.
#
# Every value below comes from Komodo's environment section — nothing secret
# lives in this file.

name: rechnungshof

services:
    frontend:
        container_name: rechnungshof_frontend
        image: ghcr.io/dragonmasta37070/rechnungshof-frontend:${IMAGE_TAG:-latest}
        pull_policy: always
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
        networks:
            - internal
            - proxy
        labels:
            traefik.enable: "true"
            traefik.docker.network: ${TRAEFIK_NETWORK}
            traefik.http.routers.rechnungshof.rule: Host(`${RECHNUNGSHOF_DOMAIN}`)
            traefik.http.routers.rechnungshof.entrypoints: ${TRAEFIK_ENTRYPOINT}
            traefik.http.routers.rechnungshof.tls: "true"
            traefik.http.routers.rechnungshof.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
            traefik.http.services.rechnungshof.loadbalancer.server.port: "80"

    api:
        container_name: rechnungshof_backend
        image: ghcr.io/dragonmasta37070/rechnungshof-api:${IMAGE_TAG:-latest}
        pull_policy: always
        command: api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            ABRECHNUNG_SERVICE__NAME: Rechnungshof

            ABRECHNUNG_DATABASE__HOST: postgres
            ABRECHNUNG_DATABASE__USER: ${POSTGRES_USER}
            ABRECHNUNG_DATABASE__DBNAME: ${POSTGRES_DB}
            ABRECHNUNG_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}

            # Must be the public HTTPS URL: it ends up in generated links.
            ABRECHNUNG_API__BASE_URL: https://${RECHNUNGSHOF_DOMAIN}
            # Container-internal port, reached by nginx in the frontend container.
            # Nothing is published to the host here.
            ABRECHNUNG_API__PORT: 8080
            ABRECHNUNG_API__SECRET_KEY: ${ABRECHNUNG_API__SECRET_KEY}
            ABRECHNUNG_API__ID: default

            # Read these off Authentik's .well-known document, do not hand-assemble
            # them. ISSUER must match the token's iss claim exactly, trailing
            # slash included. AUDIENCE is the provider's client id, and the app
            # picks it up from GET /api/config — so it is set once, here.
            ABRECHNUNG_OIDC__ISSUER: ${ABRECHNUNG_OIDC__ISSUER}
            ABRECHNUNG_OIDC__AUDIENCE: ${ABRECHNUNG_OIDC__AUDIENCE}
            ABRECHNUNG_OIDC__JWKS_URL: ${ABRECHNUNG_OIDC__JWKS_URL}
        healthcheck:
            test: ["CMD", "/usr/bin/curl", "--connect-timeout", "10", "--silent", "http://127.0.0.1:8080/"]
            interval: 30s
            timeout: 15s
            retries: 5
            start_period: 60s
        # No proxy network: the api is only ever reached through the frontend's
        # nginx, so Traefik has no route to it and cannot expose it by accident.
        networks:
            - internal

    postgres:
        container_name: rechnungshof_postgres
        image: docker.io/postgres:14-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - internal

volumes:
    pgdata:

networks:
    internal:
    proxy:
        external: true
        name: ${TRAEFIK_NETWORK}
