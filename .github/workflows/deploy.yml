name: Build & Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rechnungshof

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            # Both images are independent, so build them side by side rather than
            # in sequence — the api image compiles Python wheels and is the slow one.
            fail-fast: false
            matrix:
                include:
                    - name: api
                      dockerfile: docker/Dockerfile-api
                    - name: frontend
                      dockerfile: docker/Dockerfile-frontend-angular

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.name }}
              uses: docker/build-push-action@v5
              with:
                  # Root context for both: the api installs the Python package from the
                  # tree, and the Angular app imports @abrechnung/core from source
                  # through tsconfig path aliases, so it needs the whole pnpm workspace.
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
                      ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
                  # Scoped per image, otherwise the two matrix jobs overwrite each
                  # other's cache and every build starts cold.
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to Komodo
              uses: pandeptwidyaop/komodoactions@v1
              with:
                  komodo-url: ${{ secrets.KOMODO_URL }}
                  api-key: ${{ secrets.KOMODO_API_KEY }}
                  api-secret: ${{ secrets.KOMODO_API_SECRET }}
                  stack-name: "rechnungshof"
